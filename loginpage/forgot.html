<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board & Brew | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="forgot.css" />
    <script defer src="forgot.js"></script>
  </head>
  <body>
    <main class="forgot-shell">
      <div class="page-actions">
        <button
          type="button"
          class="utility-btn"
          id="rtlToggle"
          aria-label="Toggle RTL"
        >
          RTL
        </button>
        <button
          type="button"
          class="utility-btn"
          id="themeToggle"
          aria-label="Toggle dark mode"
        >
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </div>

      <section class="forgot-card" aria-label="Forgot password form">
        <div class="logo-wrap" aria-label="Board & Brew logo">
          <img src="/images/board&brew.png" alt="Board & Brew Logo" />
          <a href="/homepages/home1.html" class="logo-link">
            <div class="logo-content">
              <h2 class="logo-text">
                <span class="board">Board</span>
                <span class="amp">&</span>
                <span class="brew">Brew</span>
              </h2>
              <div class="tagline">
                <span class="line"></span>
                <p>WHERE EVERY MOVE</p>
                <span class="line"></span>
              </div>
              <h5 class="sub-tagline">COMES WITH A BREW.</h5>
            </div>
          </a>
        </div>

        <div class="card-copy">
          <i class="fa-solid fa-lock-reset" aria-hidden="true"></i>
          <h2>Forgot Password?</h2>
          <p>
            Enter your registered email address and we’ll send you a reset link.
          </p>
        </div>

        <form class="forgot-form" action="#" method="post">
          <div class="field">
            <label for="email">Email Address</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <button type="submit" class="reset-btn">Send Reset Link</button>
        </form>

        <div class="links">
          <a href="login.html">← Back to Login</a>
          <a href="signup.html">Create Account</a>
        </div>
      </section>
    </main>
  </body>
</html>
